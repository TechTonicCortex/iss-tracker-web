<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISS Live Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #020b18;
    --panel: #040f1e;
    --border: #0a3060;
    --accent: #00d4ff;
    --accent2: #00ff88;
    --warn: #ff6b35;
    --text: #c8e8ff;
    --dim: #4a7a9b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 80%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 40%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 10%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 60%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 95%, rgba(255,255,255,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    padding: 20px 30px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 10;
    background: rgba(4, 15, 30, 0.9);
    backdrop-filter: blur(10px);
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
  }

  .logo span { color: var(--accent2); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 12px;
    color: var(--dim);
  }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    height: calc(100vh - 73px);
    position: relative;
    z-index: 1;
  }

  #map {
    width: 100%;
    height: 100%;
    filter: hue-rotate(180deg) invert(1) brightness(0.7) contrast(1.2);
  }

  .sidebar {
    background: rgba(4, 15, 30, 0.95);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 0;
  }

  .card {
    border-bottom: 1px solid var(--border);
    padding: 20px;
  }

  .card-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0.8;
  }

  .coord-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .coord-box {
    background: rgba(0, 212, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }

  .coord-label {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .coord-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(10, 48, 96, 0.5);
    font-size: 13px;
  }

  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--dim); }
  .stat-value { color: var(--text); font-weight: 500; }
  .stat-value.highlight { color: var(--accent2); }
  .stat-value.warn { color: var(--warn); }

  .astronaut-list { display: flex; flex-direction: column; gap: 8px; }

  .astronaut {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(0, 212, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
  }

  .astronaut-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .astronaut-name { color: var(--text); font-weight: 500; }
  .astronaut-craft { color: var(--dim); font-size: 11px; }

  .orbit-info {
    background: rgba(0, 255, 136, 0.05);
    border: 1px solid rgba(0, 255, 136, 0.2);
    border-radius: 6px;
    padding: 12px;
    margin-top: 12px;
  }

  .orbit-stat {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 4px 0;
  }

  .update-time {
    font-size: 11px;
    color: var(--dim);
    text-align: center;
    padding: 12px;
  }

  .countdown {
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
  }

  .loading {
    color: var(--dim);
    font-size: 13px;
    text-align: center;
    padding: 20px;
    animation: blink 1s infinite;
  }

  @keyframes blink { 50% { opacity: 0.3; } }

  /* Custom map marker */
  .iss-icon-wrapper {
    background: transparent;
    border: none;
  }

  .trail-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.4;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">ISS<span>·</span>LIVE</div>
  <div class="status-bar">
    <div class="live-dot"></div>
    <span>LIVE TRACKING</span>
    <span id="update-clock">--:--:--</span>
  </div>
</header>

<div class="main">
  <div id="map"></div>

  <div class="sidebar">

    <div class="card">
      <div class="card-title">Position</div>
      <div class="coord-grid">
        <div class="coord-box">
          <div class="coord-label">LAT</div>
          <div class="coord-value" id="lat">---</div>
        </div>
        <div class="coord-box">
          <div class="coord-label">LON</div>
          <div class="coord-value" id="lon">---</div>
        </div>
      </div>
      <div class="orbit-info">
        <div class="orbit-stat">
          <span style="color:var(--dim)">Altitude</span>
          <span style="color:var(--accent2)">~408 km</span>
        </div>
        <div class="orbit-stat">
          <span style="color:var(--dim)">Speed</span>
          <span style="color:var(--accent2)">~27,600 km/h</span>
        </div>
        <div class="orbit-stat">
          <span style="color:var(--dim)">Orbit period</span>
          <span style="color:var(--accent2)">~90 min</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">From Halton, Ontario</div>
      <div id="distance-display" class="loading">Calculating...</div>
    </div>

    <div class="card">
      <div class="card-title" id="astro-title">Humans in Space</div>
      <div id="astronaut-list" class="loading">Loading crew...</div>
    </div>

    <div class="update-time">
      Refreshes in <span class="countdown" id="countdown">5</span>s
    </div>

  </div>
</div>

<script>
const MY_LAT = 43.5;
const MY_LON = -79.8;
const trail = [];
const MAX_TRAIL = 20;

// Init map
const map = L.map('map', {
  center: [0, 0],
  zoom: 2,
  zoomControl: true,
  attributionControl: false
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ISS icon
const issIcon = L.divIcon({
  html: `<div style="font-size:28px;filter:drop-shadow(0 0 8px #00d4ff);transform:translate(-14px,-14px)">🛸</div>`,
  className: 'iss-icon-wrapper',
  iconSize: [1, 1]
});

// Halton marker
const haltonIcon = L.divIcon({
  html: `<div style="font-size:20px;transform:translate(-10px,-20px)">📍</div>`,
  className: 'iss-icon-wrapper',
  iconSize: [1, 1]
});

L.marker([MY_LAT, MY_LON], {icon: haltonIcon})
  .addTo(map)
  .bindPopup('Your location: Halton, ON');

let issMarker = null;
let trailLine = null;

function distanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2)**2;
  return Math.round(R * 2 * Math.asin(Math.sqrt(a)));
}

async function fetchISS() {
  try {
    const res = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
    const data = await res.json();
    return { lat: data.latitude, lon: data.longitude };
  } catch {
    return null;
  }
}

async function fetchAstronauts() {
  try {
    const res = await fetch('http://api.open-notify.org/astros.json');
    const data = await res.json();
    return data;
  } catch {
    return null;
  }
}

function updateMap(lat, lon) {
  document.getElementById('lat').textContent = lat.toFixed(4) + '°';
  document.getElementById('lon').textContent = lon.toFixed(4) + '°';

  const dist = distanceKm(MY_LAT, MY_LON, lat, lon);
  const distEl = document.getElementById('distance-display');
  distEl.innerHTML = `
    <div class="stat-row">
      <span class="stat-label">Distance</span>
      <span class="stat-value highlight">${dist.toLocaleString()} km</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Status</span>
      <span class="stat-value ${dist < 5000 ? 'warn' : ''}">${dist < 5000 ? '⚠ ISS OVERHEAD SOON' : 'Orbiting elsewhere'}</span>
    </div>
  `;

  // Update trail
  trail.push([lat, lon]);
  if (trail.length > MAX_TRAIL) trail.shift();

  // Update marker
  if (issMarker) map.removeLayer(issMarker);
  issMarker = L.marker([lat, lon], {icon: issIcon}).addTo(map)
    .bindPopup(`ISS Position<br>Lat: ${lat.toFixed(2)}° | Lon: ${lon.toFixed(2)}°`);

  // Draw trail
  if (trailLine) map.removeLayer(trailLine);
  if (trail.length > 1) {
    trailLine = L.polyline(trail, {
      color: '#00d4ff',
      weight: 2,
      opacity: 0.5,
      dashArray: '4 6'
    }).addTo(map);
  }
}

function updateAstronauts(data) {
  if (!data) return;
  const title = document.getElementById('astro-title');
  title.textContent = `Humans in Space (${data.number})`;

  const list = document.getElementById('astronaut-list');
  const emojis = ['👨‍🚀','👩‍🚀','🧑‍🚀'];
  list.innerHTML = data.people.map((p, i) => `
    <div class="astronaut">
      <div class="astronaut-icon">${emojis[i % emojis.length]}</div>
      <div>
        <div class="astronaut-name">${p.name}</div>
        <div class="astronaut-craft">${p.craft}</div>
      </div>
    </div>
  `).join('');
}

// Countdown timer
let countdownVal = 5;
setInterval(() => {
  countdownVal--;
  if (countdownVal < 0) countdownVal = 5;
  document.getElementById('countdown').textContent = countdownVal;
}, 1000);

// Clock
setInterval(() => {
  document.getElementById('update-clock').textContent =
    new Date().toLocaleTimeString();
}, 1000);

// Main update loop
async function update() {
  const pos = await fetchISS();
  if (pos) updateMap(pos.lat, pos.lon);

  const astros = await fetchAstronauts();
  if (astros) updateAstronauts(astros);

  countdownVal = 5;
}

update();
setInterval(update, 5000);
</script>
</body>
</html>
